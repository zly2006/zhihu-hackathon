</head>
<body>
<main>
  <h1>KISS 速查</h1>
  <p class="lede">这个知识库只做四件事：保存原文、制作卡片、归入抽屉、寻找路口。</p>

  <div class="grid">
    <section class="card"><strong>原文</strong>知乎回答的一个版本。负责“他说了什么”。</section>
    <section class="card"><strong>卡片</strong>一次“什么处境—选了什么—后来怎样”的决策经历。</section>
    <section class="card"><strong>抽屉</strong>把前置处境相近的卡片放进同一个规范情景。</section>
    <section class="card"><strong>路口</strong>同一抽屉里出现两类以上选择，并且能看到后续。</section>
  </div>

  <h2>最小闭环</h2>
  <div class="flow"><span>回答</span><b>→</b><span>决策卡片</span><b>→</b><span>情景抽屉</span><b>→</b><span>选择分组</span><b>→</b><span>分叉路口</span></div>

  <h2>三条不变规则</h2>
  <ol>
    <li>结论必须能回到原文证据。</li>
    <li>情景只看选择之前，不看选择和结果。</li>
    <li>自述结果只是观察，不是因果证明。</li>
  </ol>

  <p class="foot"><a href="../lessons/0001-kiss-decision-knowledge-base.html">返回短课</a> · <a href="../知乎决策路径数据库落地方案.md">查看完整方案</a></p>
</main>
</body>
