<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>人生决策知识库</title>
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body class="user-shell">
    <header class="topbar">
      <a class="brand" href="/">
        <span class="brand-mark">路</span>
        <span><strong>人生决策知识库</strong><small>证据 · 情景 · 分叉</small></span>
      </a>
      <nav><a href="#scenarios">情景路口</a><a class="quiet-link" href="/admin">管理端 ↗</a></nav>
    </header>

    <main class="user-main">
      <section class="hero-block">
        <p class="eyebrow">LOCAL DECISION WORKSPACE</p>
        <h1>先看别人怎么走，<em>再看路口在哪里。</em></h1>
        <p class="hero-copy">从真实知乎回答开始，保留原文证据，再把已经审核的经历整理成可比较的情景和分叉。</p>
        <form id="search-form" class="search-box">
          <span class="search-icon">⌕</span>
          <input id="search-input" name="q" placeholder="搜索职业、读研、转行、创业……" autocomplete="off" />
          <button type="submit">搜索回答</button>
        </form>
        <div class="quick-searches" aria-label="快捷搜索">
          <button data-query="转行">转行</button>
          <button data-query="读研">读研 / 工作</button>
          <button data-query="创业">创业</button>
        </div>
      </section>

      <section class="workspace-grid">
        <div class="results-panel panel">
          <div class="section-heading">
            <div><p class="eyebrow">SOURCE CARDS</p><h2>回答证据</h2></div>
            <span id="result-count" class="count-pill">加载中</span>
          </div>
          <div id="results" class="result-list"><div class="empty-state">正在读取本地数据……</div></div>
        </div>

        <aside id="scenarios" class="scenario-panel panel">
          <div class="section-heading"><div><p class="eyebrow">REVIEWED PATHS</p><h2>已审核情景</h2></div></div>
          <div id="scenario-list" class="scenario-list"><div class="empty-state">还没有审核完成的情景。</div></div>
          <p class="muted-note">情景和分叉只显示管理端确认过的内容，避免把未经核对的推断当成建议。</p>
        </aside>
      </section>
    </main>

    <dialog id="answer-dialog" class="detail-dialog">
      <button class="dialog-close" data-close-dialog aria-label="关闭">×</button>
      <div id="answer-detail"></div>
    </dialog>
    <script src="/assets/user.js" defer></script>
  </body>
</html>
