<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>人生决策知识库</title>
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body class="user-shell">
    <header class="topbar">
      <a class="brand" href="/">
        <span class="brand-mark">库</span>
        <span><strong>人生决策知识库</strong><small>情景 → 分叉 → 证据</small></span>
      </a>
      <nav><a href="#evidence">原文快照</a><a class="quiet-link" href="/admin">管理端 ↗</a></nav>
    </header>

    <main class="user-main">
      <section class="hero-block database-hero">
        <p class="eyebrow">DATABASE / USER VIEW</p>
        <h1>先看<strong>情景和分叉，</strong><br /><em>再回到原文证据。</em></h1>
        <p class="hero-copy">这里不把回答堆成信息流。每一条可见的分叉，都应该能回到具体的知乎 URL、快照和 raw HTML。</p>
      </section>

      <section id="overview-strip" class="overview-strip" aria-label="数据库流水线状态"></section>

      <section id="scenarios" class="panel scenario-first-panel">
        <div class="section-heading">
          <div><p class="eyebrow">SEMANTIC LAYER</p><h2>情景与分叉</h2><p class="section-note">情景描述“从哪里出发”，分叉描述“有哪些行动”。</p></div>
          <span id="scenario-status" class="count-pill">读取中</span>
        </div>
        <div id="scenario-list" class="scenario-grid"><div class="empty-state">正在读取情景层……</div></div>
      </section>

      <section id="evidence" class="panel evidence-first-panel">
        <div class="section-heading evidence-heading">
          <div><p class="eyebrow">SOURCE / SNAPSHOT LAYER</p><h2>原文快照</h2><p class="section-note">这是证据库，不是推荐列表。搜索后可打开正文和 raw HTML。</p></div>
          <span id="result-count" class="count-pill">加载中</span>
        </div>
        <form id="search-form" class="search-box compact-search">
          <span class="search-icon">⌕</span>
          <input id="search-input" name="q" placeholder="搜索转行、读研、创业……" autocomplete="off" />
          <button type="submit">检索快照</button>
        </form>
        <div class="quick-searches" aria-label="快捷搜索">
          <button data-query="转行">转行</button><button data-query="读研">读研 / 工作</button><button data-query="创业">创业</button>
        </div>
        <div id="results" class="result-list"><div class="empty-state">正在读取快照库……</div></div>
      </section>
    </main>

    <dialog id="answer-dialog" class="detail-dialog">
      <button class="dialog-close" data-close-dialog aria-label="关闭">×</button>
      <div id="answer-detail"></div>
    </dialog>
    <script src="/assets/user.js" defer></script>
  </body>
</html>
